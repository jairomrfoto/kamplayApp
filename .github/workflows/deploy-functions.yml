name: Deploy Firebase Functions

on:
  push:
    branches: [main, claude/audit-bolt-app-O4YSY]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install function dependencies
        run: npm --prefix functions install

      # Crea functions/.env con toda la config (sensible y no sensible)
      - name: Create functions/.env
        run: |
          echo "APP_URL=https://kamplay-7a007.web.app"      > functions/.env
          echo "SMTP_HOST=smtp.gmail.com"                  >> functions/.env
          echo "SMTP_PORT=587"                              >> functions/.env
          echo "SMTP_USER=${{ vars.SMTP_USER }}"            >> functions/.env
          echo "SMTP_FROM=${{ vars.SMTP_FROM }}"            >> functions/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"         >> functions/.env
          echo "ANTHROPIC_KEY=${{ secrets.ANTHROPIC_KEY }}" >> functions/.env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"         >> functions/.env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> functions/.env

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project kamplay-7a007
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
