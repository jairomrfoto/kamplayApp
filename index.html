      "@context": "https://schema.org",

      },

      },
      "featureList": [
        "Gestión de acampados y participantes",
        "Control de área médica y alergias",

    <!-- ── Structured Data: FAQ ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay es una plataforma de gestión para campamentos de verano y campus diurnos. Reúne en una sola app las herramientas que necesitan coordinadores, monitores y familias: gestión de participantes, área médica, actividades, comunicación y mucho más."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay funciona con planes de pago por evento: Express (9 €, hasta 3 días) y Estándar (15 €, hasta 7 días). Para coordinadores con varios programas al año existe el plan Profesional (30 €/mes o 250 €/año) con campamentos y campus ilimitados. No hay opción gratuita."
          }
        },
        {
          "@type": "Question",
          "name": "¿Para qué tipos de campamentos sirve Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay está diseñado tanto para campamentos de verano con pernocta (en cabañas o tiendas de campaña) como para campus diurnos sin pernocta. Se adapta a todo tipo de programas de verano para niños y jóvenes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Pueden los padres ver la información de sus hijos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Los padres y tutores tienen acceso a un panel propio donde pueden ver el menú, las actividades, el estado médico de su hijo y las novedades del campamento en tiempo real, utilizando el código de acceso que les facilita el coordinador."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se unen los monitores al campamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El coordinador genera un código de acceso exclusivo para monitores. Basta con que compartan ese código y los monitores se unen al campamento al instante, con acceso a sus grupos y participantes asignados."
          }
        },
        {
          "@type": "Question",
          "name": "¿Se puede usar Kamplay en el móvil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Kamplay está optimizado para funcionar en móvil, tablet y ordenador. No requiere descarga de ninguna app: funciona directamente desde el navegador en cualquier dispositivo."
          }
        }
      ]
    }
    </script>
