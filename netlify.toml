# Redirect www → apex domain
[[redirects]]
  from = "https://www.kamplay.es/*"
  to   = "https://kamplay.es/:splat"
  status = 301
  force  = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
