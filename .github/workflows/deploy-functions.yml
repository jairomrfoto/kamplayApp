name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Autenticación con la cuenta de servicio de Firebase
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install function dependencies
        run: npm --prefix functions install

      # Crea functions/.env con la config no sensible
      - name: Create functions/.env
        run: |
          echo "APP_URL=https://kamplay-7a007.web.app" > functions/.env
          echo "SMTP_HOST=smtp.gmail.com"             >> functions/.env
          echo "SMTP_PORT=587"                         >> functions/.env
          echo "SMTP_USER=${{ vars.SMTP_USER }}"       >> functions/.env
          echo "SMTP_FROM=${{ vars.SMTP_FROM }}"       >> functions/.env

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project kamplay-7a007
