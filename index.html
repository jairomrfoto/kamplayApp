    <!-- ── Structured Data: FAQ ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es Kamplay y para qué sirve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay es una plataforma de gestión para campamentos de verano y campus diurnos. Reúne en una sola app las herramientas que necesitan coordinadores, monitores y familias: gestión de participantes con datos médicos, área médica, actividades, asistencia diaria y comunicación en tiempo real."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay funciona con planes de pago por evento: Express (9 €, campamento de hasta 3 días) y Estándar (15 €, hasta 7 días). Para coordinadores con varios programas al año existe el plan Profesional (30 €/mes o 250 €/año) con campamentos y campus ilimitados. No hay opción gratuita, pero puedes explorar la plataforma con una demo sin registrarte."
          }
        },
        {
          "@type": "Question",
          "name": "¿Para qué tipos de campamentos está diseñado Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kamplay está diseñado tanto para campamentos de verano con pernocta (en cabañas o tiendas de campaña) como para campus diurnos sin pernocta. Se adapta a programas de cualquier tamaño, desde 20 hasta cientos de participantes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Pueden los padres ver la información de sus hijos en el campamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Los padres y tutores tienen acceso a un panel propio donde pueden consultar el menú diario, las actividades, el estado médico de su hijo y las novedades del campamento en tiempo real. Solo necesitan el código que les facilita el coordinador."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se unen los monitores al campamento en Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El coordinador genera un código de acceso exclusivo para monitores. Con ese código, los monitores se unen al instante y acceden a sus grupos, participantes asignados y todas las herramientas de gestión del día a día."
          }
        },
        {
          "@type": "Question",
          "name": "¿Se puede usar Kamplay en el móvil sin instalar nada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Kamplay está optimizado para funcionar en móvil, tablet y ordenador sin necesidad de descargar ninguna app. Funciona directamente desde el navegador en cualquier dispositivo y sistema operativo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué información médica se puede gestionar en Kamplay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada ficha de participante incluye alergias, intolerancias alimentarias, medicación con pauta y dosis, enfermedades crónicas y observaciones médicas. El área médica permite registrar incidencias y llevar un seguimiento completo durante todo el programa."
          }
        }
      ]
    }
    </script>
